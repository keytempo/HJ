<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050505" />
    <title>Hand Jumper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preconnect"
      href="https://raw.githubusercontent.com"
      crossorigin
    />
    <link rel="dns-prefetch" href="https://raw.githubusercontent.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css"
    />
    <noscript>
      <style>
        #viewer-state {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <!-- Fixed vignette over the page. Each panel's ambient glow is native CSS
         on the panel itself (see .panel__glow). -->
    <div class="ambient-vignette" aria-hidden="true"></div>

    <!-- Loading and error overlay. While an episode opens it shows only the
         thin loader (see styles.css). The title and detail stay in the DOM,
         visually hidden, so role="status" still announces them to screen
         readers; setViewerState() in scripts.js removes .visually-hidden only
         when there's an error to report and a retry to offer. -->
    <div class="viewer-state" id="viewer-state" role="status">
      <div class="viewer-state__card">
        <h1 id="viewer-state-title" class="visually-hidden">Opening episode</h1>
        <p
          class="viewer-state__detail visually-hidden"
          id="viewer-state-detail"
        ></p>
        <div
          class="viewer-state__loader"
          id="viewer-state-loader"
          aria-hidden="true"
        >
          <span></span>
        </div>
        <button
          class="btn btn--ghost viewer-state__retry"
          id="viewer-state-retry"
          type="button"
          hidden
        >
          Try again
        </button>
      </div>
    </div>

    <main class="reader" aria-labelledby="episode-title" hidden>
      <h1 class="visually-hidden" id="episode-title"></h1>
      <div class="strip" id="strip" role="group"></div>
    </main>

    <section
      class="episode-end"
      id="episode-end"
      aria-labelledby="episode-end-title"
      hidden
    >
      <p class="eyebrow">End of episode</p>
      <h2 id="episode-end-title"></h2>
      <p class="episode-end__detail" id="episode-end-detail"></p>
      <div class="episode-end__nav">
        <a
          class="episode-end__arrow"
          id="episode-end-prev"
          aria-label="Previous episode"
          hidden
        >
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        </a>
        <a class="episode-end__continue" id="episode-end-continue" hidden>
          <span>
            <small>Up next</small>
            <strong id="next-episode-title"></strong>
          </span>
        </a>
        <a
          class="episode-end__arrow"
          id="episode-end-next"
          aria-label="Next episode"
          hidden
        >
          <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </a>
      </div>
    </section>

    <div
      class="pull-indicator pull-indicator--prev"
      id="pull-prev"
      aria-live="polite"
      hidden
    >
      <span class="pull-indicator__label">Pull for previous episode</span>
      <span class="pull-indicator__progress"></span>
    </div>

    <div
      class="pull-indicator pull-indicator--next"
      id="pull-next"
      aria-live="polite"
      hidden
    >
      <span class="pull-indicator__label">Pull for next episode</span>
      <span class="pull-indicator__progress"></span>
    </div>

    <noscript>
      <div class="noscript-state">
        <div class="viewer-state__card">
          <h1>JavaScript is required</h1>
          <p class="viewer-state__detail">
            Enable JavaScript to load and navigate the archived episodes.
          </p>
        </div>
      </div>
    </noscript>

    <script src="assets/shared.js" defer></script>
    <script src="assets/scripts.js" defer></script>
  </body>
</html>
