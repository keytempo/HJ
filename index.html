<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <meta name="theme-color" content="#050505" />
        <title>Hand Jumper</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="assets/styles.css" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css"
        />
    </head>
    <body>
        <div class="ambient" id="ambient" aria-hidden="true"></div>
        <div class="ambient-vignette" aria-hidden="true"></div>

        <!-- Silent by default: no visible heading or explanatory text while
             the episode opens, only the thin loader below (see styles.css).
             Title/detail stay in the DOM and screen-reader-reachable via
             .visually-hidden the whole time; scripts.js only ever un-hides
             them and gives them real content when there's an actual error
             to report and a retry to offer. -->
        <div class="viewer-state" id="viewer-state" role="status">
            <div class="viewer-state__card">
                <h1 id="viewer-state-title" class="visually-hidden">
                    Opening episode
                </h1>
                <p
                    class="viewer-state__detail visually-hidden"
                    id="viewer-state-detail"
                ></p>
                <div
                    class="viewer-state__loader"
                    id="viewer-state-loader"
                    aria-hidden="true"
                >
                    <span></span>
                </div>
                <button
                    class="viewer-state__retry"
                    id="viewer-state-retry"
                    type="button"
                    hidden
                >
                    Try again
                </button>
            </div>
        </div>

        <main class="reader" aria-labelledby="episode-title" hidden>
            <h1 class="visually-hidden" id="episode-title"></h1>
            <div class="strip" id="strip"></div>
        </main>

        <section
            class="episode-end"
            id="episode-end"
            aria-labelledby="episode-end-title"
            hidden
        >
            <p class="eyebrow" id="episode-end-eyebrow">End of episode</p>
            <h2 id="episode-end-title"></h2>
            <p class="episode-end__detail" id="episode-end-detail"></p>
            <div class="episode-end__nav">
                <a
                    class="episode-end__arrow"
                    id="episode-end-prev"
                    aria-label="Previous episode"
                    hidden
                    ><i class="fa-solid fa-arrow-left"></i
                ></a>
                <a class="episode-end__continue" id="episode-end-continue" hidden>
                    <span>
                        <small>Next episode</small>
                        <strong id="next-episode-title"></strong>
                    </span>
                </a>
                <a
                    class="episode-end__arrow"
                    id="episode-end-next"
                    aria-label="Next episode"
                    hidden
                    ><i class="fa-solid fa-arrow-right"></i
                ></a>
            </div>
        </section>

        <div class="next-episode" id="next-episode" aria-live="polite" hidden>
            <span class="next-episode__label">Pull for next episode</span>
            <span class="next-episode__progress"></span>
        </div>

        <noscript>
            <style>
                #viewer-state {
                    display: none;
                }
            </style>
            <div class="noscript-state">
                <div class="viewer-state__card">
                    <h1>JavaScript is required</h1>
                    <p class="viewer-state__detail">
                        Enable JavaScript to load and navigate the archived
                        episodes.
                    </p>
                </div>
            </div>
        </noscript>

        <script src="assets/scripts.js" defer></script>
    </body>
</html>
